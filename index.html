<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera đóng hàng</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#6b7280;--ac:#0a7d4f;--rd:#d92d20;--bd:#e3e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--tx:#eef0f3;--mu:#98a0ab;--ac:#2fbf82;--rd:#f97066;--bd:#2a2e35}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--tx:#eef0f3;--mu:#98a0ab;--ac:#2fbf82;--rd:#f97066;--bd:#2a2e35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block;visibility:hidden}
#pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;border-radius:99px;font-size:14px}
.badge.rec{background:var(--rd)}
.guide{position:absolute;inset:30% 12%;border:2px dashed rgba(255,255,255,.6);border-radius:10px;pointer-events:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.code{font-size:22px;font-weight:700;word-break:break-all}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
button.stop{background:var(--rd)}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:8px 10px;font-size:14px}
button:disabled{opacity:.5}
.big{width:100%;margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item b{word-break:break-all;font-size:14px}
</style>
</head>
<body>
<main>
<h1>📦 Camera đóng hàng</h1>
<div class="cam"><video id="v" playsinline muted></video><canvas id="pv"></canvas><div class="guide"></div><div class="badge" id="badge">Chưa bật camera</div></div>
<button class="big" id="start">Bật camera</button>
<div class="card">
  <div class="mu">Mã đơn hiện tại</div>
  <div class="code" id="code">—</div>
  <div class="mu" id="hint">Bật camera rồi đưa mã vạch vào khung để bắt đầu quay.</div>
  <button class="big stop" id="stop" disabled>Dừng &amp; lưu video</button>
</div>
<div class="card">
  <div class="mu">Nhập tay hoặc dùng máy quét mã vạch (Bluetooth/USB)</div>
  <div class="row"><input id="man" placeholder="Mã đơn hàng" autocomplete="off" autocapitalize="characters"><button id="go">Quay</button></div>
</div>
<div class="card"><div class="mu" style="margin-bottom:4px">Video đã quay (phiên này)</div><div id="list"><div class="mu">Chưa có video.</div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
let rc,rctx,cstream,stream,rec,chunks=[],cur=null,t0=0,timer,lastSeen='',lastAt=0,detector,zx,items=[];
const mime=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
const ext=mime.startsWith('video/mp4')?'mp4':'webm';
const pad=n=>String(n).padStart(2,'0');
const safe=s=>s.replace(/[\\\/:*?"<>|\s]+/g,'_').slice(0,80);
const stamp=()=>{const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())};

async function startCam(){
  try{
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:true})}
    catch(e){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
    $('v').srcObject=stream;await $('v').play();
    initCanvas();
    $('start').style.display='none';$('badge').textContent='Sẵn sàng quét';
    try{await navigator.wakeLock?.request('screen')}catch(e){}
    await initScan();loop();
  }catch(e){$('badge').textContent='Lỗi camera';$('hint').textContent='Không mở được camera ('+(e.name||'lỗi')+'). '+(e.name==='NotAllowedError'?'Trang bị chặn quyền camera (có thể do khung nhúng của Claude). Hãy mở bản chạy độc lập.':'Kiểm tra quyền camera rồi thử lại.')}
}
async function initScan(){
  if('BarcodeDetector' in window){try{detector=new BarcodeDetector();return}catch(e){}}
  await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}).catch(()=>{});
  if(window.ZXing){zx=new ZXing.MultiFormatReader();const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);zx.setHints(h)}
  else $('hint').textContent='Không tải được bộ quét mã. Hãy nhập tay hoặc dùng máy quét.';
}
const cv=document.createElement('canvas');
async function readCode(){
  const v=$('v');if(v.readyState<2)return null;
  if(detector){const r=await detector.detect(v).catch(()=>[]);return r[0]?r[0].rawValue:null}
  if(zx){
    cv.width=v.videoWidth;cv.height=v.videoHeight;const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(v,0,0);
    try{const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);return zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText()}catch(e){return null}
  }
  return null;
}
async function loop(){
  const c=await readCode();
  if(c){const now=Date.now();if(!(c===lastSeen&&now-lastAt<3000)){lastSeen=c;lastAt=now;onCode(c)}else lastAt=now}
  setTimeout(loop,250);
}
function onCode(c){
  c=c.trim();if(!c||c===cur)return;
  if(rec)stopRec();
  startRec(c);
}
function initCanvas(){
  const v=$('v');rc=$('pv');rctx=rc.getContext('2d');
  rc.width=v.videoWidth||1280;rc.height=v.videoHeight||720;
  cstream=rc.captureStream(30);
  stream.getAudioTracks().forEach(t=>cstream.addTrack(t));
  setInterval(()=>{
    if(v.readyState<2)return;
    if(!rec&&(rc.width!==v.videoWidth||rc.height!==v.videoHeight)){rc.width=v.videoWidth;rc.height=v.videoHeight}
    rctx.drawImage(v,0,0,rc.width,rc.height);
    const d=new Date();
    const txt=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+(cur?'  |  '+cur:'');
    const fs=Math.max(14,Math.round(Math.min(rc.width,rc.height)/24));
    rctx.font='bold '+fs+'px sans-serif';rctx.textBaseline='middle';
    const w=rctx.measureText(txt).width,h=fs*1.6,m=fs*.5;
    rctx.fillStyle='rgba(0,0,0,.55)';rctx.fillRect(m,rc.height-h-m,w+fs,h);
    rctx.fillStyle='#fff';rctx.fillText(txt,m+fs/2,rc.height-h/2-m);
  },33);
}
function startRec(c){
  if(!stream||!window.MediaRecorder){$('hint').textContent='Trình duyệt này không hỗ trợ quay video.';return}
  cur=c;chunks=[];
  rec=new MediaRecorder(cstream||stream,mime?{mimeType:mime,videoBitsPerSecond:2500000}:{videoBitsPerSecond:2500000});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const code=c,parts=chunks;
  rec.onstop=()=>finish(code,new Blob(parts,{type:mime||'video/webm'}));
  rec.start(1000);t0=Date.now();
  $('code').textContent=c;$('stop').disabled=false;$('badge').className='badge rec';
  $('hint').textContent='Đang quay. Quét mã đơn khác hoặc bấm Dừng để kết thúc.';
  clearInterval(timer);timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('badge').textContent='● REC '+pad(Math.floor(s/60))+':'+pad(s%60)},500);
  if(navigator.vibrate)navigator.vibrate(80);
}
function stopRec(){
  if(!rec)return;clearInterval(timer);
  if(rec.state!=='inactive')rec.stop();
  rec=null;cur=null;$('stop').disabled=true;$('badge').className='badge';$('badge').textContent='Sẵn sàng quét';
  $('hint').textContent='Đã dừng. Đưa mã đơn tiếp theo vào khung.';
}
function finish(code,blob){
  if(!blob.size)return;
  const it={name:safe(code)+'_'+stamp()+'.'+ext,blob,saved:false};
  items.unshift(it);render();save(it);
}
async function save(it){
  let d=null;try{d=await claude.use('downloads')}catch(e){}
  if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(it.blob);a.download=it.name;document.body.appendChild(a);a.click();a.remove();it.saved=true;it.note='Đã tải xuống';render();return}
  try{await d.save({filename:it.name,data:it.blob});it.saved=true;it.note='Đã lưu'}
  catch(e){it.note=e.code==='declined'?'Chưa lưu':'Lỗi lưu ('+(e.code||'?')+')'}
  render();
}
function render(){
  const l=$('list');if(!items.length)return;l.innerHTML='';
  items.forEach(it=>{
    const r=document.createElement('div');r.className='item';
    const a=document.createElement('div');const b=document.createElement('b');b.textContent=it.name;
    const m=document.createElement('div');m.className='mu';m.textContent=(it.blob.size/1048576).toFixed(1)+' MB · '+(it.note||'');
    a.append(b,m);
    const bt=document.createElement('button');bt.className='ghost';bt.textContent=it.saved?'Lưu lại':'Lưu';bt.onclick=()=>save(it);
    r.append(a,bt);l.appendChild(r);
  });
}
$('start').onclick=startCam;
$('stop').onclick=stopRec;
const manual=()=>{const v=$('man').value.trim();if(!v)return;if(!stream){$('hint').textContent='Hãy bật camera trước.';return}$('man').value='';onCode(v)};
$('go').onclick=manual;
$('man').addEventListener('keydown',e=>{if(e.key==='Enter')manual()});
</script>
</body>
</html>
